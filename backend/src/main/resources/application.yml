spring:
  application:
    name: thredge-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/thredge}
    username: ${SPRING_DATASOURCE_USERNAME:thredge}
    password: ${SPRING_DATASOURCE_PASSWORD:thredge}
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope: openid,email
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

server:
  port: ${SERVER_PORT:28080}
  servlet:
    session:
      timeout: 7d
      cookie:
        name: THREDGE_SESSION
        max-age: 7d

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://localhost:8082,http://100.89.240.59:8082}
  auth:
    oauth:
      enabled: ${APP_AUTH_OAUTH_ENABLED:false}
      success-redirect-uri: ${APP_AUTH_OAUTH_SUCCESS_REDIRECT_URI:http://localhost:8082/}
      failure-redirect-uri: ${APP_AUTH_OAUTH_FAILURE_REDIRECT_URI:http://localhost:8082/login?oauth=failed}
  ai:
    key-secret: ${APP_AI_KEY_SECRET:dev-insecure-change-me}
    openai:
      model: ${APP_AI_OPENAI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info
